<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pedoman Tata Tulis Aksara Jawa</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <meta name="description" content="Panduan Tata Tulis Aksara Jawa hasil Kongres Aksara Jawa I Yogyakarta 2021 (Prasajan / Simplified dan Lawasan / Traditional)">
  <meta name="color-scheme" content="light dark">

  <!-- Pasang tema sebelum halaman tampil agar tidak "berkedip" putih saat mode gelap -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('kaj-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>

  <!-- Tema Docsify -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <!-- Font aksara Jawa -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Javanese:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* ================= Warna dasar (mode terang) ================= */
    :root {
      --theme-color: #8b4513;
      --aksara-font: "Noto Sans Javanese", "Javanese Text", sans-serif;
      --bg: #ffffff;
      --bg-soft: #f8f8f8;
      --text: #34495e;
      --text-strong: #2c3e50;
      --text-muted: #7f8c8d;
      --border: #dddddd;
      --tip-bg: #fbf5ef;
      --warn-bg: #fdf0ec;
    }
    /* ================= Mode gelap ================= */
    html[data-theme="dark"] {
      --theme-color: #e3a566;
      --bg: #1b1d22;
      --bg-soft: #24272e;
      --text: #d4d7dd;
      --text-strong: #f0f2f5;
      --text-muted: #9aa1ab;
      --border: #3a3f48;
      --tip-bg: #2a2620;
      --warn-bg: #2f2220;
    }

    body, .markdown-section, .sidebar {
      font-family: "Source Sans Pro", "Helvetica Neue", Arial, "Noto Sans Javanese", "Javanese Text", sans-serif;
    }
    body { background: var(--bg); color: var(--text); transition: background .2s, color .2s; }
    .sidebar, .sidebar-toggle { background: var(--bg-soft); }
    .sidebar { border-right: 1px solid var(--border); }
    .sidebar ul li a, .sidebar .app-name-link { color: var(--text); }
    .sidebar ul li.active > a { color: var(--theme-color); border-right-color: var(--theme-color); }
    .sidebar-toggle span { background-color: var(--theme-color); }
    .markdown-section { color: var(--text); }
    .markdown-section h1, .markdown-section h2, .markdown-section h3,
    .markdown-section h4, .markdown-section strong { color: var(--text-strong); }
    .markdown-section a, .sidebar ul li a:hover { color: var(--theme-color); }
    .markdown-section em { color: var(--text-muted); }
    .markdown-section hr { border-bottom-color: var(--border); }

    /* Tabel */
    .markdown-section table { display: block; overflow-x: auto; border-collapse: collapse; }
    .markdown-section th, .markdown-section td { padding: 6px 12px; vertical-align: middle; border: 1px solid var(--border); }
    .markdown-section tr { border-top-color: var(--border); }
    .markdown-section tr:nth-child(2n) { background-color: var(--bg-soft); }
    .markdown-section td:first-child { white-space: nowrap; }

    /* Kode, kutipan, kotak tip/peringatan */
    .markdown-section code, .markdown-section pre { background-color: var(--bg-soft); color: var(--text-strong); }
    .markdown-section blockquote { border-left-color: var(--theme-color); color: var(--text-muted); }
    .markdown-section p.tip { background-color: var(--tip-bg); border-left-color: var(--theme-color); color: var(--text); }
    .markdown-section p.tip:before { background-color: var(--theme-color); }
    .markdown-section p.tip code { background-color: var(--bg-soft); }
    .markdown-section p.warn { background: var(--warn-bg); color: var(--text); }

    /* Pencarian & navigasi halaman */
    .search { border-bottom-color: var(--border) !important; }
    .search input { background: var(--bg) !important; color: var(--text) !important; border-color: var(--border) !important; }
    .search .matching-post { border-bottom-color: var(--border) !important; }
    .search p { color: var(--text-muted) !important; }
    .docsify-pagination-container { border-top-color: var(--border) !important; }
    .github-corner svg { fill: var(--theme-color); color: var(--bg); }

    /* Aksara Jawa butuh tinggi baris lebih besar */
    .markdown-section p, .markdown-section li,
    .markdown-section td, .markdown-section th { line-height: 2.1; }
    .jw { font-family: var(--aksara-font); font-size: 1.6em; line-height: 2.2; }
    .jw-xl { font-family: var(--aksara-font); font-size: 2.4em; line-height: 2.2; }

    /* ================= Tombol ganti tema ================= */
    #theme-toggle {
      position: fixed; right: 20px; bottom: 20px; z-index: 50;
      width: 46px; height: 46px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-soft); color: var(--text-strong);
      font-size: 22px; line-height: 1; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,.18);
      display: flex; align-items: center; justify-content: center;
    }
    #theme-toggle:hover { border-color: var(--theme-color); }
    #theme-toggle:focus-visible { outline: 2px solid var(--theme-color); outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app">Memuat dokumen...</div>

  <button id="theme-toggle" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema terang/gelap"></button>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      function render() {
        var dark = document.documentElement.getAttribute('data-theme') === 'dark';
        btn.textContent = dark ? '☀' : '☾';
        btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
        btn.title = dark ? 'Ganti ke tema terang' : 'Ganti ke tema gelap';
      }
      btn.addEventListener('click', function () {
        var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('kaj-theme', next); } catch (e) {}
        render();
      });
      render();
    })();

    window.$docsify = {
      name: 'Tata Tulis Aksara Jawa',
      repo: 'https://github.com/bahnoodamar/KAJ',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      maxLevel: 4,
      search: {
        placeholder: 'Cari kata kunci...',
        noData: 'Tidak ditemukan!',
        depth: 6
      },
      pagination: {
        previousText: 'Sebelumnya',
        nextText: 'Berikutnya',
        crossChapter: true,
        crossChapterText: true
      }
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
</body>
</html>
